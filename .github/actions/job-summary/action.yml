name: Job Summary POC
description: Generates a Jenkins-style deployment summary with PRs and commits since the previous successful deployment.

inputs:
  title:
    description: Summary title
    required: true

  environment:
    description: Target environment name
    required: true

  target-branch:
    description: Target Git branch
    required: true

  repository-path:
    description: Workspace-relative path containing the checked-out target branch
    required: false
    default: source

  github-token:
    description: GitHub token used to resolve pull requests
    required: true

  report-dir:
    description: Workspace-relative directory containing report files
    required: false
    default: deploy-reports

  state-prefix:
    description: Prefix used for successful-deployment state tags
    required: false
    default: poc-deployment-state

  update-baseline:
    description: Update the branch baseline after a successful deployment
    required: false
    default: "true"

  include-changed-files:
    description: Whether to include changed files
    required: false
    default: "true"

  include-deploy-log:
    description: Whether to include deploy.log
    required: false
    default: "true"

  deploy-log-lines:
    description: Number of deploy.log lines to include
    required: false
    default: "100"

runs:
  using: composite
  steps:
    - name: Generate Jenkins-style job summary
      shell: bash
      env:
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_TARGET_BRANCH: ${{ inputs.target-branch }}
        INPUT_REPOSITORY_PATH: ${{ inputs.repository-path }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_REPORT_DIR: ${{ inputs.report-dir }}
        INPUT_STATE_PREFIX: ${{ inputs.state-prefix }}
        INPUT_UPDATE_BASELINE: ${{ inputs.update-baseline }}
        INPUT_INCLUDE_CHANGED_FILES: ${{ inputs.include-changed-files }}
        INPUT_INCLUDE_DEPLOY_LOG: ${{ inputs.include-deploy-log }}
        INPUT_DEPLOY_LOG_LINES: ${{ inputs.deploy-log-lines }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
