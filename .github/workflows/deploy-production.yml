name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm deployment."
        required: true
        default: "NO"

  # Push trigger temporarily disabled.
  # Full automation will be implemented later as part of the GitHub Flow strategy.
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - '**/*.py'
  #     - '**/*.xml'
  #     - '**/__manifest__.py'
  #     - '.github/workflows/deploy-production.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REPORT_DIR: deploy-reports
  TARGET_ENV: production
  TARGET_BRANCH: main
  ODOO_DATABASE: prod_tribe29
  ODOO_CONFIG: /etc/odoo/odoo.conf

jobs:
  deploy:
    name: Deploy to Production
    environment:
      name: Prod
    runs-on: self-hosted
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare report files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$REPORT_DIR"
          rm -f "$REPORT_DIR/deployed-sha.txt"

          echo "unknown" > "$REPORT_DIR/deploy-status.txt"
          echo "unknown" > "$REPORT_DIR/ssh-agent-status.txt"
          echo "unknown" > "$REPORT_DIR/changed-files-status.txt"
          : > "$REPORT_DIR/deploy.log"

      - name: Verify confirmation input
        id: confirm_deployment
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event.inputs.confirm }}" != "YES" ]]; then
            echo "failed" > "$REPORT_DIR/deploy-status.txt"
            echo "Deployment not confirmed. Type YES to confirm." \
              | tee "$REPORT_DIR/deploy.log"
            exit 1
          fi

      - name: Start SSH agent
        id: ssh_agent
        if: ${{ steps.confirm_deployment.outcome == 'success' }}
        continue-on-error: true
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PORTAL }}

      - name: Record SSH agent status
        if: always()
        shell: bash
        run: |
          echo "${{ steps.ssh_agent.outcome }}" > "$REPORT_DIR/ssh-agent-status.txt"

      - name: Deploy to production server
        id: deploy_production
        if: ${{ steps.ssh_agent.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          HOST: ${{ secrets.PORTAL18_URL }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -o pipefail

          ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" \
            "TARGET_BRANCH='$TARGET_BRANCH' ODOO_DATABASE='$ODOO_DATABASE' ODOO_CONFIG='$ODOO_CONFIG' bash -s" << 'EOF' 2>&1 | tee "$REPORT_DIR/deploy.log"
          set -euo pipefail

          SERVICE_RESTART_NEEDED=false

          restart_odoo() {
            if [[ "$SERVICE_RESTART_NEEDED" == "true" ]]; then
              echo "Starting Odoo service."
              sudo systemctl start odoo
            fi
          }

          trap restart_odoo EXIT

          echo "Stopping Odoo service."
          sudo systemctl stop odoo
          SERVICE_RESTART_NEEDED=true

          echo "Updating repository."
          cd /opt/odoo/tribe29_odoo
          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          git pull --ff-only origin "$TARGET_BRANCH"
          echo "__DEPLOYED_SHA__=$(git rev-parse HEAD)"

          echo "Updating Odoo modules."
          sudo -u odoo /bin/bash -lc "
            odoo -d '$ODOO_DATABASE' -u t29_customer_portal -c '$ODOO_CONFIG' --stop-after-init
          "

          echo "Deployment commands completed."
          EOF

          EXIT_CODE=${PIPESTATUS[0]}

          DEPLOYED_SHA="$(
            sed -n 's/^__DEPLOYED_SHA__=//p' "$REPORT_DIR/deploy.log" \
              | tail -n 1
          )"

          if [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf '%s\n' "${DEPLOYED_SHA,,}" \
              > "$REPORT_DIR/deployed-sha.txt"
          else
            echo "::warning::Could not determine the exact SHA checked out on the server."
          fi

          if [[ "$EXIT_CODE" -eq 0 ]]; then
            echo "success" > "$REPORT_DIR/deploy-status.txt"
          else
            echo "failed" > "$REPORT_DIR/deploy-status.txt"
          fi

          exit "$EXIT_CODE"

      - name: Mark deployment as failed if SSH agent failed
        if: ${{ steps.confirm_deployment.outcome == 'success' && steps.ssh_agent.outcome != 'success' }}
        shell: bash
        run: |
          echo "failed" > "$REPORT_DIR/deploy-status.txt"
          echo "SSH agent failed. Deployment was not started." > "$REPORT_DIR/deploy.log"

      - name: Generate job summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          title: Production Deployment Summary
          environment: production
          target-branch: main
          github-token: ${{ github.token }}
          report-dir: deploy-reports
          include-changed-files: "true"
          include-deploy-log: "true"

      - name: Fail workflow if deployment failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_STATUS="$(cat "$REPORT_DIR/deploy-status.txt" 2>/dev/null || echo failed)"

          if [[ "$DEPLOY_STATUS" != "success" ]]; then
            echo "::error::Production deployment failed. See the job summary for details."
            exit 1
          fi

          echo "Production deployment completed successfully."